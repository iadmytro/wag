[workspace]

[package]
name = "wag-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.wag-syntax]
path = "../wag-syntax"

[dependencies.wag-types]
path = "../wag-types"

[dependencies.wag-interp]
path = "../wag-interp"

[dependencies.wag-check]
path = "../wag-check"

[[bin]]
name = "fuzz_parser"
path = "fuzz_targets/fuzz_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_pipeline"
path = "fuzz_targets/fuzz_pipeline.rs"
test = false
doc = false
bench = false
